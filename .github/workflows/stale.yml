name: Stale

on:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has been marked as stale due to inactivity. It will be closed in 7 days if no further activity occurs.'
          stale-pr-message: 'This PR has been marked as stale due to inactivity. It will be closed in 7 days if no further activity occurs.'
          close-issue-message: 'Closing this issue due to inactivity. Feel free to reopen if needed.'
          close-pr-message: 'Closing this PR due to inactivity. Feel free to reopen if needed.'
          days-before-stale: 60
          days-before-close: 7
          exempt-issue-labels: 'priority,enhancement'
          exempt-pr-labels: 'dependencies'
