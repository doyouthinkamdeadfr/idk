name: CI

on:
  pull_request:
    branches: [main]

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t app .

      - run: docker run app bun run lint
      - run: docker run app bun run check
      - run: docker run app bun run test:unit
      - run: docker run app bun run build

      - name: Deploy preview
        id: deploy
        run: |
          output=$(docker run \
            -e CLOUDFLARE_API_TOKEN \
            -e CLOUDFLARE_ACCOUNT_ID \
            app bunx wrangler pages deploy .svelte-kit/cloudflare \
            --project-name memory \
            --branch pr-${{ github.event.pull_request.number }} 2>&1)
          url=$(echo "$output" | grep -oP 'https?://[^\s]+\.pages\.dev')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.deploy.outputs.url }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview: ${url || 'Deployed (URL not found)'}`
            });
